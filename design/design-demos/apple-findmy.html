<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>SmartWear Lab · hướng Find My</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#F5F5F7;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.canvas{width:1760px;height:1000px;position:relative;overflow:hidden;
  background:radial-gradient(1200px 700px at 50% 0%,#141416 0,#050505 60%,#000 100%)}
.top{position:absolute;left:21px;right:21px;top:20px;display:flex;align-items:baseline;justify-content:space-between}
.top h1{margin:0;font:600 17px/1 'Inter Tight';letter-spacing:-.01em}
.top h1 span{color:#8E8E93;font-weight:500;margin-left:10px;font-family:Inter;font-size:14px}
.top p{margin:0;font-size:13px;color:#8E8E93}
.phones{position:absolute;left:21px;top:56px;display:flex;gap:22px}
.plabel{font-size:13px;color:#AEAEB2;margin:0 0 9px 6px;font-weight:500}
.plabel b{color:#F5F5F7;font-weight:600;margin-right:6px}
.num{font-family:'Inter Tight',Inter,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:0}
.glass{background:rgba(32,32,35,.74);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.14),0 10px 40px rgba(0,0,0,.45)}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;border-radius:34px;display:flex;flex-direction:column;overflow:hidden;
  transition:top .55s cubic-bezier(.32,.72,0,1)}
.sheet.drag{transition:none}
.grab{height:22px;flex:none;cursor:grab;touch-action:none;display:flex;justify-content:center;padding-top:8px}
.grab i{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding:2px 20px 104px}
.scroll::-webkit-scrollbar{display:none}
.rise{animation:rise .45s cubic-bezier(.32,.72,0,1)}
.h1{font:700 30px/1.1 'Inter Tight';letter-spacing:-.025em;margin:0}
.sec{font-size:15px;color:#98989F}
.cap{font-size:13px;color:#8E8E93}
.gh{font:600 20px/1.2 'Inter Tight';letter-spacing:-.015em;margin:26px 0 12px}
.group{background:rgba(255,255,255,.065);border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;min-height:64px;position:relative;cursor:pointer;transition:background .2s}
.row:hover{background:rgba(255,255,255,.04)}
.row+.row:before{content:'';position:absolute;left:72px;right:0;top:0;height:1px;transform:scaleY(.5);background:rgba(255,255,255,.16)}
.row.plain+.row.plain:before{left:16px}
.circ{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);flex:none;transition:background .2s}
.circ:hover{background:rgba(255,255,255,.18)}
.pill{white-space:nowrap;height:44px;border-radius:22px;padding:0 18px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;transition:transform .15s,background .2s}
.pill:active{transform:scale(.97)}
.pill.w{background:#F5F5F7;color:#000}
.pill.g{background:rgba(255,255,255,.1);color:#F5F5F7}
.pill[disabled]{opacity:.4;cursor:default}
.tile{border-radius:20px;background:rgba(255,255,255,.065);padding:14px 12px 13px;text-align:left;display:flex;flex-direction:column;gap:9px;min-height:104px;transition:background .2s,box-shadow .3s}
.tile:hover{background:rgba(255,255,255,.1)}
.ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.ping{position:absolute;left:50%;top:50%;border-radius:50%;border:1.5px solid;pointer-events:none;animation:ping 1.6s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes ping{from{transform:translate(-50%,-50%) scale(.9);opacity:.7}to{transform:translate(-50%,-50%) scale(2.8);opacity:0}}
@keyframes pingS{from{transform:translate(-50%,-50%) scale(1);opacity:.6}to{transform:translate(-50%,-50%) scale(1.9);opacity:0}}
@keyframes breathe{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.9)}50%{opacity:.85;transform:translate(-50%,-50%) scale(1)}}
@keyframes sweep{from{transform:translate(-50%,-50%) scale(.1);opacity:.5}to{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes beat{0%{transform:scale(1)}18%{transform:scale(1.08)}100%{transform:scale(1)}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:#F5F5F7;animation:spin .9s linear infinite;flex:none}
.orbwrap{position:absolute;transform:translate(-50%,-50%);transition:left .9s cubic-bezier(.32,.72,0,1),top .55s cubic-bezier(.32,.72,0,1),opacity .4s;cursor:pointer;text-align:center}
.tab{width:96px;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:#AEAEB2;transition:background .25s,color .25s}
.tab.on{background:rgba(255,255,255,.13);color:#F5F5F7}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;font-size:15px}
.kv+.kv{border-top:.5px solid rgba(255,255,255,.1)}
.kv span:first-child{color:#98989F}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:14px;padding:3px}
.seg button{flex:1;height:34px;border-radius:11px;font-size:14px;font-weight:500;color:#AEAEB2;transition:background .25s,color .25s}
.seg button.on{background:rgba(255,255,255,.16);color:#F5F5F7}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

/* ---------- AndroidFrame (from huashu-design/assets/android_frame.jsx; battery label 11→12px for the ≥12px rule) ---------- */
const androidFrameStyles = {
  wrapper:{display:'inline-block',padding:10,background:'#1a1a1a',borderRadius:44,boxShadow:'0 0 0 2px #2a2a2a, 0 20px 60px rgba(0,0,0,0.3)',position:'relative'},
  screen:{position:'relative',borderRadius:36,overflow:'hidden',background:'#fff'},
  statusBar:{position:'absolute',top:0,left:0,right:0,height:32,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 24px',fontSize:14,fontWeight:500,fontFamily:'Roboto, -apple-system, sans-serif',zIndex:20,pointerEvents:'none'},
  punchHole:{position:'absolute',top:10,left:'50%',transform:'translateX(-50%)',width:14,height:14,background:'#000',borderRadius:'50%',zIndex:30},
  statusIcons:{display:'flex',alignItems:'center',gap:6},
  batteryText:{fontSize:12,fontWeight:600,marginLeft:2},
  content:{position:'absolute',top:32,left:0,right:0,bottom:24,overflow:'auto'},
  navBar:{position:'absolute',bottom:0,left:0,right:0,height:24,display:'flex',alignItems:'center',justifyContent:'center',gap:60,zIndex:10},
  navButton:{width:36,height:4,background:'rgba(0,0,0,0.3)',borderRadius:999},
};
function AndroidFrame({children,width=412,height=892,time='9:41',battery=100,darkMode=false,navStyle='gesture'}){
  const textColor = darkMode ? '#fff' : '#1a1a1a';
  return (
    <div style={androidFrameStyles.wrapper}>
      <div style={{...androidFrameStyles.screen,width,height,background:darkMode?'#000':'#fff'}}>
        <div style={{...androidFrameStyles.statusBar,color:textColor}}>
          <span>{time}</span>
          <div style={androidFrameStyles.statusIcons}>
            <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><rect x="0" y="6" width="2" height="4" rx="0.5"/><rect x="4" y="4" width="2" height="6" rx="0.5"/><rect x="8" y="2" width="2" height="8" rx="0.5"/><rect x="12" y="0" width="2" height="10" rx="0.5"/></svg>
            <svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M7 9a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"/><path d="M3 6a5 5 0 018 0" stroke="currentColor" strokeWidth="1.2"/><path d="M0.5 3.5a11 11 0 0113 0" stroke="currentColor" strokeWidth="1.2" opacity="0.6"/></svg>
            <div style={{width:22,height:10,border:'1.5px solid currentColor',borderRadius:2,padding:1,position:'relative'}}>
              <div style={{width:`${battery}%`,height:'100%',background:'currentColor',borderRadius:1}}/>
            </div>
            <span style={androidFrameStyles.batteryText}>{battery}%</span>
          </div>
        </div>
        <div style={androidFrameStyles.punchHole}/>
        <div style={androidFrameStyles.content}>{children}</div>
        {navStyle==='gesture' && (
          <div style={androidFrameStyles.navBar}>
            <div style={{...androidFrameStyles.navButton,width:100,height:4,background:darkMode?'rgba(255,255,255,0.5)':'rgba(0,0,0,0.4)'}}/>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- Real data (spec.md §4) ---------- */
const DEV = [
  {id:'r09',name:'Colmi R09',short:'R09',kind:'Nhẫn',sdk:'QRing',ble:'R09_8404',mac:'30:32:43:31:84:04',hw:'RT09_V3.1',fw:'RT09_3.10.22_260420',
   color:'#6FD6C5',battery:19,bat:'23 % → 19 %, không sạc',rssiNote:'−70 đến −82 dBm',ang:-36,
   caps:['hr','spo2','temp','stress','hrv','sleep'],extra:[['Cử chỉ chạm','Hỗ trợ'],['Giấc ngủ','Giao thức mới']]},
  {id:'hs500a',name:'HS500A',short:'HS500A',kind:'Chưa rõ loại',sdk:'QRing',ble:'chưa ghi',mac:'32:35:45:37:4E:00',hw:'HS500A_V1.0',fw:'HS500A_1.00.05_260725',
   color:'#E9C46A',battery:null,bat:'chưa đo',rssiNote:'chưa đo',ang:192,
   caps:['hr','spo2','bp','stress','hrv','cycle'],extra:[['Màn hình','Không có'],['Nhiệt độ','Không hỗ trợ']]},
  {id:'coros',name:'COROS PACE 3',short:'COROS',kind:'Đồng hồ',sdk:'Chưa hỗ trợ',ble:'COROS PACE 3 8E1086',mac:'F7:AF:2F:22:09:90',hw:'—',fw:'—',
   color:'#8E8E93',battery:null,bat:'—',rssiNote:'chưa đo',ang:8,unsupported:true,reason:'Quét thấy (phát FEE7) nhưng chưa có SDK',caps:[],extra:[]},
];
const byId = id => DEV.find(d=>d.id===id);
const M = {
  hr:{label:'Nhịp tim',unit:'bpm',color:'#FF453A',icon:'heart',dur:50},
  spo2:{label:'SpO2',unit:'%',color:'#64D2FF',icon:'drop',dur:52},
  temp:{label:'Nhiệt độ',unit:'°C',color:'#FF9F0A',icon:'thermo',dur:52},
  bp:{label:'Huyết áp',unit:'mmHg',color:'#FF6482',icon:'gauge'},
  stress:{label:'Stress',unit:'',color:'#5FD38D',icon:'wave'},
  hrv:{label:'HRV',unit:'ms',color:'#FF7A6E',icon:'hrv'},
  sleep:{label:'Giấc ngủ',color:'#7DA8FF',icon:'moon',soon:true},
  cycle:{label:'Chu kỳ',color:'#FF8FB1',icon:'cycle',soon:true},
};
/* Measured today on R09 (worn): HR 79–82 (~25 s), SpO2 97–99 (~26 s), Temp 36.6 (~26 s). HS500A HR → "Chưa đeo". */
const REAL = {
  r09:{hr:{seq:[79,80,80,81,82,82,81,80,79,80,81,81,82,81,80,80,79,80,81,82],range:'79–82'},
       spo2:{seq:[97,98,98,99,98,98,97,98,99,99,98,97,98],range:'97–99'},
       temp:{final:'36,6'}},
  hs500a:{hr:{fail:'Chưa đeo'}},
};
const LAST0 = {r09:{hr:'79–82',spo2:'97–99',temp:'36,6'},hs500a:{hr:'Chưa đeo'},coros:{}};
const BULK = ['hr','spo2','temp'];
const GATT_MAX = 7;
const h2 = n => n.toString(16).toUpperCase().padStart(2,'0');
/* HR packet format from the real sample 69 01 00 4F … B5: byte[3] = bpm, last byte = sum of bytes mod 256 */
const hrHex = v => { const b=[0x69,0x01,0x00,v,0,0,0xFA,0x02,0,0,0,0,0,0,0]; b.push(b.reduce((a,c)=>a+c,0)&255); return b.map(h2).join(' '); };
const rssiR = v => 40 + (-v-60)*110/30;

/* ---------- Icons (UI glyphs only, no product drawings) ---------- */
const P = {
  heart:'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z',
  drop:'M12 3.5s6 6.3 6 10.7a6 6 0 0 1-12 0C6 9.8 12 3.5 12 3.5z',
  thermo:'M10 13.5V5.5a2 2 0 1 1 4 0v8a4 4 0 1 1-4 0z',
  gauge:'M4 16a8 8 0 1 1 16 0M12 16l3.5-4.5',
  wave:'M3 12c2.5-5 4.5-5 6 0s3.5 5 6 0 3.5-5 6 0',
  hrv:'M3 12h4l2-5 3 10 2-5h7',
  moon:'M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z',
  cycle:'M12 4a8 8 0 1 1-8 8M4 4.5v4h4',
  plus:'M12 5v14M5 12h14', x:'M7 7l10 10M17 7L7 17', chev:'M9.5 6l6 6-6 6', down:'M7 10l5 5 5-5',
  power:'M12 3.5v7M6.6 7.2a7.5 7.5 0 1 0 10.8 0', check:'M6 12.5l4 4L18 8',
  devices:'M12 12m-2.6 0a2.6 2.6 0 1 0 5.2 0a2.6 2.6 0 1 0-5.2 0M12 12m-8 0a8 8 0 1 0 16 0a8 8 0 1 0-16 0',
  radar:'M12 12m-1.2 0a1.2 1.2 0 1 0 2.4 0a1.2 1.2 0 1 0-2.4 0M8 16a5.6 5.6 0 0 1 0-8M16 8a5.6 5.6 0 0 1 0 8M5.2 18.8a9.6 9.6 0 0 1 0-13.6M18.8 5.2a9.6 9.6 0 0 1 0 13.6',
  bars:'M5 20v-7M10 20V5M15 20v-10M20 20V8', play:'M8 5.5v13l10.5-6.5z', stop:'M7.5 7.5h9v9h-9z',
};
const Ic = ({n,s=20,c='currentColor',w=1.9,fill}) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill={fill?c:'none'} stroke={fill?'none':c} strokeWidth={w} strokeLinecap="round" strokeLinejoin="round"><path d={P[n]}/></svg>
);

/* Abstract device marker: a lit sphere. Placeholder — no official product photos yet. */
const orbBg = c => `radial-gradient(circle at 34% 28%, rgba(255,255,255,.9) 0, ${c} 36%, ${c}AA 62%, #0b0c0e 120%)`;
function Orb({d,size=44,state='connected'}){
  const off = state!=='connected';
  return <div style={{width:size,height:size,borderRadius:'50%',flex:'none',position:'relative',
    background:off?'rgba(255,255,255,.06)':orbBg(d.color),
    boxShadow:off?`inset 0 0 0 1.5px ${d.color}88`:`0 0 ${size*.45}px ${d.color}40, inset 0 -3px 8px rgba(0,0,0,.35)`,
    opacity:d.unsupported?.6:1}}/>;
}
function Battery({v}){
  if(v==null) return <span className="cap">Pin chưa đo</span>;
  return <span className="cap" style={{display:'inline-flex',alignItems:'center',gap:6,color:'#AEAEB2'}}>
    <span style={{width:22,height:11,borderRadius:3.5,border:'1.2px solid #8E8E93',padding:1.5,display:'inline-block',position:'relative'}}>
      <span style={{display:'block',height:'100%',width:`${v}%`,borderRadius:1.5,background:v<20?'#FF9F0A':'#F5F5F7'}}/>
    </span><span className="num">{v} %</span></span>;
}

/* ---------- State ---------- */
function init(v){
  const s = {conn:{r09:'connected',hs500a:'connected',coros:'unsupported'},tab:'devices',sel:null,sessions:{},
    last:JSON.parse(JSON.stringify(LAST0)),log:{r09:[{t:'notify',hex:'73 0C 13',note:'pin 19 %'}],hs500a:[],coros:[]},
    rssi:{r09:-74},pk:{r09:0,hs500a:0},bulk:'hr',found:['r09','coros','hs500a'],picked:[],scanning:false,scanT:9,tech:false,toast:null,top:280};
  const ses = (m,t)=>{const r=REAL.r09[m];const hist=r.seq?Array.from({length:t},(_,i)=>r.seq[(i+1)%r.seq.length]):[];return {m,t,hist,val:hist[hist.length-1]??null,done:false};};
  if(v==='A'){ s.sessions={r09:ses('spo2',14)}; }
  if(v==='B'){ s.conn={r09:'idle',hs500a:'idle',coros:'unsupported'}; s.tab='scan'; s.scanning=true; s.scanT=6; s.picked=['r09','hs500a']; s.top=196; }
  if(v==='C'){ s.sel='r09'; s.sessions={r09:ses('hr',18)}; s.top=150; s.log.r09=[...s.log.r09,...s.sessions.r09.hist.slice(-6).map((h,i)=>({t:`+${((13+i)*0.5).toFixed(1).replace('.',',')} s`,hex:hrHex(h)}))]; }
  if(v==='D'){ s.tab='feas'; s.sessions={r09:ses('hr',10),hs500a:{m:'hr',t:2,hist:[],val:null,done:false}}; s.top=118; }
  return s;
}
function step(id,x){
  const r=(REAL[id]||{})[x.m], t=x.t+1;
  if(!r) return t>=3?{...x,t,done:true,note:'chưa đo'}:{...x,t};
  if(r.fail) return t>=4?{...x,t,done:true,note:r.fail}:{...x,t};
  if(r.seq){const v=r.seq[t%r.seq.length];return {...x,t,val:v,hist:[...x.hist.slice(-27),v],done:t>=M[x.m].dur};}
  return t>=M[x.m].dur?{...x,t,done:true,val:r.final}:{...x,t};
}
const fmt = (m,v) => v==null?'—':(m==='temp'?String(v).replace('.',','):String(v));

/* ---------- Proximity field (full-bleed canvas, like the map in Find My) ---------- */
function Field({s,on}){
  const cx=196, half=s.top/2, cy=half+(s.top>=240?14:6), ky=Math.min(.72,Math.max(.16,(half-30)/170));
  const list = DEV.filter(d => d.unsupported ? s.tab==='scan' && s.found.includes(d.id) : (s.conn[d.id]!=='idle' || (s.tab==='scan'&&s.found.includes(d.id))));
  return (
    <div style={{position:'absolute',inset:0,background:`radial-gradient(420px 360px at ${cx}px ${cy}px,#17191c 0,#0c0d0f 55%,#060607 100%)`,overflow:'hidden'}}>
      {[48,92,136,172].map(r=><div key={r} style={{position:'absolute',left:cx-r,top:cy-r*ky,width:r*2,height:r*2*ky,borderRadius:'50%',
        border:`1px ${r===172?'dashed':'solid'} rgba(255,255,255,${r===172?.09:.075})`,transition:'all .55s cubic-bezier(.32,.72,0,1)'}}/>)}
      {s.tab==='scan'&&s.scanning&&[0,1].map(i=><div key={i} style={{position:'absolute',left:cx,top:cy,width:380,height:380,borderRadius:'50%',
        background:'radial-gradient(circle,transparent 55%,rgba(255,255,255,.07) 70%,transparent 72%)',animation:`sweep 3.2s ${i*1.6}s cubic-bezier(.2,.6,.3,1) infinite`}}/>)}
      {s.top>=240&&<div style={{position:'absolute',left:20,top:16,opacity:s.toast?0:1,transition:'opacity .3s'}}>
        <div style={{fontSize:13,fontWeight:600,color:'#C7C7CC'}}>Trường tín hiệu</div>
        <div style={{fontSize:12,color:'#8E8E93',marginTop:2}}>càng gần tâm, tín hiệu càng mạnh</div>
      </div>}
      <div style={{position:'absolute',left:cx,top:cy,transform:'translate(-50%,-50%)',transition:'top .55s cubic-bezier(.32,.72,0,1)'}}>
        <div style={{width:12,height:12,borderRadius:'50%',background:'#F5F5F7',boxShadow:'0 0 0 7px rgba(255,255,255,.07),0 0 24px rgba(255,255,255,.35)'}}/>
      </div>
      {list.map(d=>{
        const st=s.conn[d.id], known=d.id==='r09'&&(st==='connected'||(s.tab==='scan'&&s.found.includes('r09')));
        const r=known?rssiR(s.rssi.r09):(d.unsupported?150:150), a=d.ang*Math.PI/180;
        const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a)*ky-(s.top<240?10:0), ses=s.sessions[d.id], sel=s.sel===d.id;
        const sz=st==='connected'?30:24;
        const sub = ses&&!ses.done ? (ses.val!=null?`${fmt(ses.m,ses.val)} ${M[ses.m].unit}`:ses.note||M[ses.m].label)
          : st==='connecting'?'đang kết nối':st==='idle'?'chưa kết nối':d.unsupported?'chưa hỗ trợ':!known?'RSSI chưa đo':'';
        return (
          <div key={d.id} className="orbwrap" style={{left:x,top:y}} onClick={()=>on.open(d.id)}>
            <div style={{position:'relative',width:sz,height:sz,margin:'0 auto'}}>
              {st==='connected'&&ses&&!ses.done&&<span key={s.pk[d.id]} className="ping" style={{width:sz,height:sz,borderColor:ses?M[ses.m].color:d.color}}/>}
              {st==='connecting'&&<span style={{position:'absolute',left:'50%',top:'50%',width:sz+18,height:sz+18,borderRadius:'50%',border:`1.5px solid ${d.color}`,animation:'breathe 1.4s ease-in-out infinite'}}/>}
              {sel&&<span style={{position:'absolute',inset:-6,borderRadius:'50%',boxShadow:'0 0 0 2px #F5F5F7'}}/>}
              <Orb d={d} size={sz} state={st==='unsupported'?'connected':st}/>
            </div>
            <div style={{marginTop:8,fontSize:13,fontWeight:600,color:'#F2F2F7',whiteSpace:'nowrap'}}>{d.short}</div>

          </div>);
      })}
    </div>);
}

/* ---------- Sheet: A · Devices ---------- */
function Devices({s,on}){
  const bm=M[s.bulk], support=DEV.filter(d=>s.conn[d.id]==='connected'&&d.caps.includes(s.bulk)).length;
  const nConn=DEV.filter(d=>s.conn[d.id]==='connected').length;
  const row = d => {
    const st=s.conn[d.id], ses=s.sessions[d.id], live=ses&&!ses.done;
    const sub = d.unsupported?d.reason.replace('Quét thấy (phát FEE7) nhưng ','Phát FEE7 · '):st==='connecting'?'Đang kết nối…':st==='idle'?'Chưa kết nối':st==='lost'?'Mất kết nối':
      live?`Đang đo ${M[ses.m].label}`:ses&&ses.done?`${M[ses.m].label}: ${ses.note||'hoàn tất'}`:s.last[d.id].hr?`Nhịp tim: ${s.last[d.id].hr}`:'Đã kết nối';
    return (
      <div key={d.id} className="row" onClick={()=>on.open(d.id)}>
        <Orb d={d} size={40} state={st==='unsupported'?'connected':st}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:17,fontWeight:600,letterSpacing:'-.01em'}}>{d.name}</div>
          <div className="sec" style={{marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',display:'flex',alignItems:'center',gap:6}}>
            {live&&<span style={{width:7,height:7,borderRadius:'50%',background:M[ses.m].color,flex:'none'}}/>}
            {st==='connecting'&&<span className="spin" style={{width:12,height:12}}/>}{sub}</div>
        </div>
        {!d.unsupported&&<div style={{textAlign:'right'}}>
          {live&&ses.val!=null&&<div className="num" style={{fontSize:22,fontWeight:600,color:M[ses.m].color,lineHeight:1.1}}>{fmt(ses.m,ses.val)}<span style={{fontSize:13,color:'#98989F',marginLeft:3,fontWeight:500}}>{M[ses.m].unit}</span></div>}
          {st==='connected'&&d.battery!=null&&<div style={{marginTop:3}}><Battery v={d.battery}/></div>}
        </div>}
        {!d.unsupported&&<button className="circ" aria-label={st==='connected'?'Ngắt kết nối':'Kết nối'} title={st==='connected'?'Ngắt':'Kết nối'}
          onClick={e=>{e.stopPropagation();on.toggle(d.id);}} style={{width:32,height:32,color:st==='connected'?'#AEAEB2':'#30D158'}}><Ic n="power" s={16}/></button>}
      </div>);
  };
  return (<>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',margin:'6px 0 4px'}}>
      <h2 className="h1">Thiết bị</h2>
      <button className="circ" aria-label="Thêm thiết bị" onClick={()=>on.tab('scan')}><Ic n="plus" s={18}/></button>
    </div>
    <div className="sec" style={{marginBottom:18}}>{nConn} đang kết nối · {support} hỗ trợ {bm.label.toLowerCase()}</div>
    <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:20}}>
      <button className="pill w" onClick={on.bulk} disabled={!support}><Ic n="play" s={14} fill c="#000"/>Đo đồng loạt</button>
      <button className="pill g" onClick={on.cycleBulk} style={{paddingRight:12}}>
        <span style={{width:8,height:8,borderRadius:'50%',background:bm.color}}/>{bm.label}<Ic n="down" s={16} c="#98989F"/></button>
    </div>
    <div className="group">{DEV.filter(d=>!d.unsupported).map(row)}</div>
    <div className="gh" style={{fontSize:17,margin:'24px 0 10px'}}>Chưa hỗ trợ</div>
    <div className="group">{DEV.filter(d=>d.unsupported).map(row)}</div>
    <div className="cap" style={{margin:'14px 4px 0',lineHeight:1.5}}>{nConn} / {GATT_MAX} kết nối · Android thường giới hạn khoảng {GATT_MAX} kết nối GATT đồng thời.</div>
  </>);
}

/* ---------- Sheet: B · Scan & add ---------- */
function Scan({s,on}){
  const found=DEV.filter(d=>s.found.includes(d.id));
  const sup=found.filter(d=>!d.unsupported), uns=found.filter(d=>d.unsupported);
  const n=s.picked.length, busy=DEV.some(d=>s.conn[d.id]==='connecting');
  const row = d => {
    const st=s.conn[d.id], pk=s.picked.includes(d.id), done=st==='connected';
    return (
      <div key={d.id} className="row rise" style={{cursor:d.unsupported||done?'default':'pointer'}} onClick={()=>!d.unsupported&&!done&&on.pick(d.id)}>
        {d.unsupported? <div style={{width:24}}/> :
          <div style={{width:24,height:24,borderRadius:'50%',flex:'none',display:'grid',placeItems:'center',transition:'all .2s',
            background:pk||done?'#0A84FF':'transparent',boxShadow:pk||done?'none':'inset 0 0 0 1.5px #636366'}}>{(pk||done)&&<Ic n="check" s={15} c="#fff" w={2.6}/>}</div>}
        <Orb d={d} size={36} state={d.unsupported?'connected':done?'connected':'idle'}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:17,fontWeight:600,color:d.unsupported?'#AEAEB2':'#F5F5F7'}}>{d.name}</div>
          <div className="sec" style={{marginTop:2}}>{d.unsupported?'Phát FEE7 · chưa có SDK':d.kind}</div>
        </div>
        {st==='connecting'&&<span style={{display:'flex',alignItems:'center',gap:8}} className="cap"><span className="spin"/>Đang nối</span>}
        {done&&<span className="cap" style={{color:'#30D158',fontWeight:500}}>Đã kết nối</span>}
      </div>);
  };
  return (<>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',margin:'6px 0 4px'}}>
      <h2 className="h1">Thêm thiết bị</h2>
      <button className="pill g" style={{height:34,fontSize:14,padding:'0 14px'}} onClick={on.rescan}>Quét lại</button>
    </div>
    <div className="sec" style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
      {s.scanning&&<span className="spin" style={{width:13,height:13}}/>}{s.scanning?'Đang tìm thiết bị gần đây…':`Tìm thấy ${found.length} thiết bị`}</div>
    {sup.length>0&&<><div className="gh" style={{fontSize:17,margin:'18px 0 10px'}}>QRing <span className="sec" style={{fontWeight:400}}>· {sup.length}</span></div>
      <div className="group">{sup.map(row)}</div></>}
    {uns.length>0&&<><div className="gh" style={{fontSize:17,margin:'22px 0 10px'}}>Chưa hỗ trợ</div>
      <div className="group">{uns.map(row)}</div>
      <div className="cap" style={{margin:'10px 4px 0',lineHeight:1.5}}>Hiện mờ vì chưa có SDK. Khai báo khả năng là có giao diện.</div></>}
    <button className="pill w" style={{width:'100%',justifyContent:'center',height:52,borderRadius:26,fontSize:17,marginTop:22}} disabled={!n||busy} onClick={on.connect}>
      {busy?'Đang kết nối song song…':n?`Kết nối ${n} thiết bị`:'Chọn thiết bị để kết nối'}</button>
  </>);
}

/* ---------- Sheet: C · Device card ---------- */
function Detail({s,on}){

          <span>{d.kind} · {d.unsupported?'Chưa hỗ trợ':st==='connected'?'Đã kết nối':st==='connecting'?'Đang kết nối…':'Chưa kết nối'}</span>

      <div className="group" style={{marginTop:20,padding:'18px 18px 16px',position:'relative',overflow:'hidden'}}>
        {ses ? (<>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontSize:15,fontWeight:600,color:m.color}}>{m.label}</span>

          </div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:6,minHeight:84}}>
            {ses.val!=null ? <div className="num" style={{fontSize:68,fontWeight:600,lineHeight:1,letterSpacing:'-.035em'}}>{fmt(ses.m,ses.val)}

              : <div className="num" style={{fontSize:ses.note?34:22,fontWeight:600,color:ses.note?'#F5F5F7':'#AEAEB2'}}>{ses.note||'Đang ổn định…'}</div>}
            <div style={{position:'relative',width:64,height:64,flex:'none'}}>

                <Ic n={m.icon} s={20} c={m.color}/></div>

            {hist.length? hist.slice(-28).map((v,i,a)=><span key={ses.t-a.length+i} style={{width:6,borderRadius:3,flex:'none',background:m.color,
              opacity:.25+.75*(i/(a.length-1||1)),height:10+(hi>lo?(v-lo)/(hi-lo):.5)*24,transition:'height .3s'}}/>)
              : <div style={{flex:1,height:4,borderRadius:2,background:'rgba(255,255,255,.08)',alignSelf:'center',overflow:'hidden'}}>
                  <div style={{height:'100%',width:`${Math.min(100,ses.t/(m.dur||4)*100)}%`,background:m.color,transition:'width .5s linear'}}/></div>}
          </div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:12}}>
            <span className="cap">{hist.length?'Mỗi vạch là một gói, 0,5 s':ses.done?'':'Gói đến mỗi 0,5 s'}</span>
            {live&&<button className="pill g" style={{height:32,fontSize:13,padding:'0 12px'}} onClick={()=>on.stop(d.id)}><Ic n="stop" s={12} fill/>Dừng</button>}
          </div>
        </>) : (
          <div style={{padding:'6px 0'}}>

    {!d.unsupported&&<><div className="gh">Phép đo</div>

        ['RSSI',d.id==='r09'&&st==='connected'?`${s.rssi.r09} dBm (thật: ${d.rssiNote})`:d.rssiNote]].map(([k,v])=>
        <div key={k} className="kv"><span>{k}</span><span className={/[0-9A-F]{2}:|_V|_\d/.test(v)?'mono':''} style={{textAlign:'right',color:v==='chưa đo'||v==='chưa ghi'?'#98989F':'#F5F5F7',alignSelf:'center'}}>{v}</span></div>)}
      <div style={{padding:'12px 16px 14px',borderTop:'.5px solid rgba(255,255,255,.1)'}}>
        <div className="cap" style={{marginBottom:8}}>Gói thô gần nhất</div>
        {(s.log[d.id]||[]).length?(s.log[d.id]).slice(-6).map((l,i)=><div key={i} className="mono" style={{display:'flex',gap:10,color:'#D1D1D6',lineHeight:'20px'}}>
          <span style={{color:'#8E8E93',width:44,flex:'none'}}>{l.t}</span><span>{l.hex}</span>{l.note&&<span style={{color:'#8E8E93'}}>{l.note}</span>}</div>)
          :<div className="cap">Chưa có gói.</div>}
        <div className="cap" style={{marginTop:8,lineHeight:1.45}}>Gói nhịp tim dựng theo mẫu thật 69 01 00 4F … B5 (byte 4 = bpm, byte cuối = tổng kiểm). Mẫu hex SpO2 chưa ghi lại.</div>
      </div>
    </div>}
    {!d.unsupported&&st==='connected'&&<div className="group" style={{marginTop:24}}>
      <div className="row plain" style={{minHeight:52}} onClick={()=>on.toggle(d.id)}><span style={{fontSize:17,color:'#FF6961'}}>Ngắt kết nối</span></div></div>}
  </div>);
}

/* ---------- Sheet: D · Feasibility ---------- */

    <div className="seg" style={{marginTop:22}}>{BULK.map(k=><button key={k} className={s.bulk===k?'on':''} onClick={()=>on.setBulk(k)}>{M[k].label}</button>)}</div>
    <button className="pill w" style={{width:'100%',justifyContent:'center',height:50,borderRadius:25,fontSize:16,marginTop:10}} disabled={!support.length} onClick={on.bulk}>
      <Ic n="play" s={14} fill c="#000"/>Đo đồng loạt · {support.length} thiết bị</button>
    <div style={{marginTop:10,display:'flex',flexDirection:'column',gap:6}}>

      {DEV.map(d=>{const live=d.id==='r09'&&s.conn.r09==='connected';return (

          {d.id==='r09'?<>{cell(live?`${s.rssi.r09}`:'chưa đo',live)}{cell('≈ 2',true)}{cell('chưa đo')}{cell('chưa đo')}</>
            :<span style={{gridColumn:'2 / 6',fontSize:13,color:'#98989F'}}>Cả 4 chỉ số: chưa đo</span>}</>}
        </div>);})}

  </>);
}

/* ---------- One phone = one state machine ---------- */
const DETENTS=[118,150,196,280,520];
function AppPhone({v}){
  const [s,set]=useState(()=>init(v));
  const [drag,setDrag]=useState(null);
  const up = f => set(p=>({...p,...(typeof f==='function'?f(p):f)}));
  useEffect(()=>{const id=setInterval(()=>set(p=>{
    const n={...p,sessions:{...p.sessions},pk:{...p.pk},last:{...p.last},log:{...p.log}};
    if(p.conn.r09==='connected') n.rssi={r09:Math.max(-82,Math.min(-70,p.rssi.r09+Math.round(Math.random()*4-2)))};
    for(const id in p.sessions){const x=p.sessions[id]; if(x.done||p.conn[id]!=='connected') continue;
      const y=step(id,x); n.sessions[id]=y; n.pk[id]=(p.pk[id]||0)+1;
      const ts=`+${(y.t*0.5).toFixed(1).replace('.',',')} s`;
      if(x.m==='hr'&&y.val!=null) n.log[id]=[...(p.log[id]||[]).slice(-10),{t:ts,hex:hrHex(y.val)}];
      if(y.done){ n.last[id]={...p.last[id],[x.m]:y.val!=null?(x.m==='temp'?y.val:REAL[id][x.m].range):y.note};
        if(x.m==='temp') n.log[id]=[...(p.log[id]||[]).slice(-10),{t:ts,hex:'6A 0B A6 …',note:'dừng · 36,6'}]; }
    }
    if(p.scanning){ const t=p.scanT+1; n.scanT=t; n.found=['r09','coros','hs500a'].slice(0,t<2?0:t<4?1:t<5?2:3); if(t>=16) n.scanning=false; }
    return n;}),500); return ()=>clearInterval(id);},[]);
  useEffect(()=>{ if(!s.toast) return; const t=setTimeout(()=>up({toast:null}),2200); return ()=>clearTimeout(t); },[s.toast]);

  const connectIds = ids => { up(p=>({conn:{...p.conn,...Object.fromEntries(ids.map(i=>[i,'connecting']))}}));
    ids.forEach((id,i)=>setTimeout(()=>up(p=>({conn:{...p.conn,[id]:'connected'}})),1300+i*650)); };
  const on = {
    open:id=>up(p=>({sel:id,top:p.sel?p.top:150,tech:p.sel===id?p.tech:false})),
    close:()=>up(p=>({sel:null,top:p.tab==='feas'?118:p.tab==='scan'?196:280})),
    tab:t=>up({tab:t,sel:null,top:t==='feas'?118:t==='scan'?196:280}),
    toast:m=>up({toast:m}), tech:()=>up(p=>({tech:!p.tech})),
    pick:id=>up(p=>({picked:p.picked.includes(id)?p.picked.filter(x=>x!==id):[...p.picked,id]})),
    rescan:()=>up(p=>({scanning:true,scanT:0,found:[],picked:[]})),
    connect:()=>{const ids=s.picked; connectIds(ids); up({picked:[]});
      setTimeout(()=>up({tab:'devices',top:280,toast:`Đã kết nối song song ${ids.length} thiết bị`}),1300+ids.length*650+500);},
    toggle:id=>{ if(s.conn[id]==='connected'){ up(p=>{const ss={...p.sessions};delete ss[id];return {conn:{...p.conn,[id]:'idle'},sessions:ss,toast:`Đã ngắt ${byId(id).short}`};}); }
      else connectIds([id]); },
    measure:(id,k)=>{ if(M[k].soon) return up({toast:`${M[k].label}: đồng bộ lịch sử sắp có`});
      if(s.conn[id]!=='connected') return up({toast:'Kết nối thiết bị trước khi đo'});
      up(p=>({sessions:{...p.sessions,[id]:{m:k,t:0,hist:[],val:null,done:false}}})); },
    stop:id=>up(p=>({sessions:{...p.sessions,[id]:{...p.sessions[id],done:true}}})),
    cycleBulk:()=>up(p=>({bulk:BULK[(BULK.indexOf(p.bulk)+1)%BULK.length]})),
    setBulk:k=>up({bulk:k}),
    bulk:()=>up(p=>{const ss={...p.sessions};let n=0;DEV.forEach(d=>{if(p.conn[d.id]==='connected'&&d.caps.includes(p.bulk)){ss[d.id]={m:p.bulk,t:0,hist:[],val:null,done:false};n++;}});
      return {sessions:ss,toast:`Đo ${M[p.bulk].label} đồng loạt trên ${n} thiết bị`};}),
  };
  const top = drag?drag.top:s.top;
  const down = e=>{e.currentTarget.setPointerCapture(e.pointerId); setDrag({y0:e.clientY,t0:s.top,top:s.top});};
  const move = e=>{ if(!drag) return; setDrag({...drag,top:Math.max(90,Math.min(560,drag.t0+e.clientY-drag.y0))}); };
  const end = ()=>{ if(!drag) return; const t=DETENTS.reduce((a,b)=>Math.abs(b-drag.top)<Math.abs(a-drag.top)?b:a); setDrag(null); up({top:t}); };
  const field = {...s,top};
  return (
    <AndroidFrame width={393} height={851} darkMode battery={76}>
      <div style={{position:'absolute',inset:0,background:'#000',overflow:'hidden'}}>
        <Field s={field} on={on}/>
        <div className={`sheet glass ${drag?'drag':''}`} style={{top}}>
          <div className="grab" onPointerDown={down} onPointerMove={move} onPointerUp={end} onPointerCancel={end}><i/></div>
          <div className="scroll" style={{paddingBottom:s.sel?28:104}} key={s.sel?'d':s.tab}>
            {s.sel?<Detail s={s} on={on}/>:s.tab==='devices'?<Devices s={s} on={on}/>:s.tab==='scan'?<Scan s={s} on={on}/>:<Feas s={s} on={on}/>}
          </div>
          {!s.sel&&<div style={{position:'absolute',left:0,right:0,bottom:0,height:124,pointerEvents:'none',background:'linear-gradient(rgba(27,27,30,0),rgba(25,25,28,.98) 58%)'}}/>}
        </div>
        {!s.sel&&<div className="glass" style={{position:'absolute',bottom:16,left:'50%',transform:'translateX(-50%)',borderRadius:32,padding:5,display:'flex',gap:2}}>
          {[['devices','devices','Thiết bị'],['scan','radar','Thêm'],['feas','bars','Khả thi']].map(([k,ic,l])=>
            <button key={k} className={`tab ${s.tab===k?'on':''}`} onClick={()=>on.tab(k)}><Ic n={ic} s={20}/>{l}</button>)}
        </div>}
        {s.toast&&<div className="glass rise" style={{position:'absolute',top:12,left:'50%',transform:'translateX(-50%)',borderRadius:20,padding:'10px 16px',fontSize:14,fontWeight:500,whiteSpace:'nowrap',zIndex:5}}>{s.toast}</div>}
      </div>
    </AndroidFrame>);
}

const SCREENS=[['A','Thiết bị','danh sách sống trong sheet'],['B','Quét & thêm','chọn nhiều, nối song song'],['C','Thẻ thiết bị','R09 đang đo nhịp tim'],['D','Khả thi','giám sát song song']];
function Canvas(){
  return (<div className="canvas">
    <div className="top">
      <h1>SmartWear Lab<span>hướng Find My · Android dark · 393×851</span></h1>
      <p>Font: Inter / Inter Tight thay SF Pro (không dùng SF trên Android) · số đo là số thật; “chưa đo” = chưa có số thật</p>
    </div>
    <div className="phones">{SCREENS.map(([k,t,d])=>(
      <div key={k}><div className="plabel"><b>{k} · {t}</b>{d}</div><AppPhone v={k}/></div>))}</div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Canvas/>);
</script>
</body>
