  body{width:1760px;height:1000px;overflow:hidden}
  .num{font-family:"Inter Tight",Inter,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;letter-spacing:-0.02em}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .press{transition:transform .18s ease,opacity .18s ease}
  .press:active{transform:scale(.97)}
  .scroll{scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breathe{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:.8;transform:scale(1)}}
  @keyframes ripple{0%{transform:scale(.55);opacity:.5}100%{transform:scale(1.35);opacity:0}}

  .breathe{animation:breathe 2.4s ease-in-out infinite}

<script type="text/babel" data-presets="react">
const { useState, useEffect, useReducer } = React;

/* ---------- AndroidFrame (copied verbatim from huashu-design/assets/android_frame.jsx) ---------- */

            <svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M7 9a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" /><path d="M3 6a5 5 0 018 0" stroke="currentColor" strokeWidth="1.2" /><path d="M0.5 3.5a11 11 0 0113 0" stroke="currentColor" strokeWidth="1.2" opacity="0.6" /></svg>
            <div style={{ width: 22, height: 10, border: '1.5px solid currentColor', borderRadius: 2, padding: 1, position: 'relative' }}>
              <div style={{ width: `${battery}%`, height: '100%', background: 'currentColor', borderRadius: 1 }} />

    </div>
  );
}

/* ---------- Tokens ---------- */
const C = {
  bg: '#000', card: '#1C1C1E', card2: '#2C2C2E', label: '#FFFFFF', sec: '#A1A1A8', hair: 'rgba(255,255,255,0.08)',
  green: '#30D158', blue: '#0A84FF', yellow: '#FFD60A',
};
/* Health-style category tints (Apple system colours, dark variants) */
const METRIC = {
  hr:      { name: 'Nhịp tim',    unit: 'bpm',  color: '#FF375F', icon: 'heart',   live: true },
  spo2:    { name: 'SpO2',        unit: '%',    color: '#64D2FF', icon: 'drop',    live: true },
  temp:    { name: 'Nhiệt độ',    unit: '°C',   color: '#FF9F0A', icon: 'temp',    live: true },
  bp:      { name: 'Huyết áp',    unit: 'mmHg', color: '#FF453A', icon: 'gauge',   live: true },
  stress:  { name: 'Stress',      unit: '',     color: '#66D4CF', icon: 'stress',  live: true },
  hrv:     { name: 'HRV',         unit: 'ms',   color: '#FF6482', icon: 'pulse',   live: true },
  sleep:   { name: 'Giấc ngủ',    unit: '',     color: '#7DA2FF', icon: 'moon',    live: false, note: 'Giao thức mới' },
  cycle:   { name: 'Chu kỳ',      unit: '',     color: '#FF7AB6', icon: 'cycle',   live: false },
  gesture: { name: 'Cử chỉ chạm', unit: '',     color: '#B8B8BF', icon: 'tap',     live: false },
};
/* Real device data from spec §4 — nothing invented */
const DEV = {
  r09: { id: 'r09', name: 'Colmi R09', short: 'R09', kind: 'Nhẫn', sdk: 'QRing', ble: 'R09_8404', mac: '30:32:43:31:84:04',
    hw: 'RT09_V3.1', fw: 'RT09_3.10.22_260420', battery: 19, batteryNote: '23 % → 19 %, không sạc', rssi: '−70 đến −82 dBm', bars: 2,
    tint: '#E6C68F', caps: ['hr', 'spo2', 'temp', 'stress', 'hrv', 'sleep', 'gesture'],
    last: { hr: '79–82', spo2: '97–99', temp: '36,6' }, hero: 'hr' },
  hs: { id: 'hs', name: 'HS500A', short: 'HS500A', kind: 'Chưa rõ loại', sdk: 'QRing', ble: null, mac: '32:35:45:37:4E:00',
    hw: 'HS500A_V1.0', fw: 'HS500A_1.00.05_260725', battery: null, rssi: null, bars: null, note: 'Không màn hình · không nhiệt độ',
    tint: '#A9C2E3', caps: ['hr', 'spo2', 'bp', 'stress', 'hrv', 'cycle'], last: { hr: 'Chưa đeo' }, hero: 'hr' },
  coros: { id: 'coros', name: 'COROS PACE 3', kind: 'Đồng hồ', sdk: null, ble: 'COROS PACE 3 8E1086', mac: 'F7:AF:2F:22:09:90',
    reason: 'Phát FEE7, chưa có SDK' },
};
const QRING = ['r09', 'hs'];
const GATT_LIMIT = 7;

/* Measurement scripts — real values only. One step = one 0.5 s packet. */
const hrHex = v => { const b = [0x69,0x01,0x00,v,0x00,0x00,0xFA,0x02,0,0,0,0,0,0,0]; const s = b.reduce((a, x) => a + x, 0) & 0xFF; return [...b, s].map(x => x.toString(16).toUpperCase().padStart(2, '0')).join(' '); };
const SCRIPT = {
  r09: {
    hr:   { kind: 'series', total: 50, seq: [79,80,80,81,82,81,80,80,79,80,81,81,82,80,79,80], summary: '79–82' },
    spo2: { kind: 'series', total: 52, seq: [97,98,98,99,98,97,98,99,98,98], summary: '97–99' },
    temp: { kind: 'final',  total: 52, value: '36,6', summary: '36,6' },
  },
  hs: { hr: { kind: 'notworn', total: 4 } },
};
const vn = n => String(n).replace('.', ',');

function simReducer(st, a) {
  if (a.type === 'start') {
    const sc = SCRIPT[a.id] && SCRIPT[a.id][a.metric]; if (!sc) return st;
    const m = METRIC[a.metric];
    return { sess: { ...st.sess, [a.id]: { metric: a.metric, t: 0, total: sc.total, vals: [], done: false, result: null } },
      logs: { ...st.logs, [a.id]: [{ at: '0,0 s', txt: 'Bắt đầu đo ' + m.name.toLowerCase() }, ...st.logs[a.id]].slice(0, 30) } };
  }
  if (a.type === 'stop') { const s = st.sess[a.id]; if (!s) return st; return { ...st, sess: { ...st.sess, [a.id]: { ...s, done: true, result: s.result || 'Đã dừng' } } }; }
  if (a.type === 'tick') {
    let changed = false; const sess = { ...st.sess }; const logs = { ...st.logs };
    for (const id in sess) {
      const s = sess[id]; if (s.done) continue; changed = true;
      const sc = SCRIPT[id][s.metric]; const t = s.t + 1; const at = vn((t * 0.5).toFixed(1)) + ' s';
      let vals = s.vals, entry = null, done = t >= s.total, result = null;
      if (sc.kind === 'series') {
        const v = sc.seq[(t - 1) % sc.seq.length]; vals = [...vals, v];
        entry = s.metric === 'hr' ? { at, hex: hrHex(v), txt: 'Nhịp tim ' + v } : { at, txt: 'SpO2 ' + v + ' % · hex chưa ghi lại' };
        if (done) result = sc.summary;
      } else if (sc.kind === 'final') {
        entry = done ? { at, hex: '6A 0B A6 …', txt: 'Dừng đo nhiệt độ · 36,6 °C' } : (t % 4 === 0 ? { at, txt: 'Gói đo nhiệt độ #' + t } : null);
        if (done) { vals = [sc.value]; result = sc.summary; }
      } else if (sc.kind === 'notworn') {
        entry = done ? { at, txt: 'Thiết bị báo: Chưa đeo' } : null; if (done) result = 'Chưa đeo';
      }
      sess[id] = { ...s, t, vals, done, result };
      if (entry) logs[id] = [entry, ...logs[id]].slice(0, 30);
    }
    return changed ? { sess, logs } : st;
  }
  return st;
}
const seedLogs = () => ({
  r09: [
    { at: 'trước', hex: '73 0C 13', txt: 'Notify pin · 19 %' },
    { at: 'trước', hex: '6A 0B A6 …', txt: 'Dừng đo nhiệt độ · 36,6 °C' },
    { at: 'trước', hex: '69 01 00 4F 00 00 FA 02 00 00 00 00 00 00 00 B5', txt: 'Nhịp tim 79' },
  ],
  hs: [{ at: 'trước', txt: 'Đo nhịp tim → Chưa đeo' }],
});

/* ---------- Icons (UI glyphs only) ---------- */
const P = {
  heart: <path d="M12 20.3s-7.4-4.5-9.1-9.3C1.7 7.6 4 4.6 7.2 4.6c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.2 0 5.5 3 4.3 6.4-1.7 4.8-9.1 9.3-9.1 9.3z" fill="currentColor" />,
  drop: <path d="M12 3.2c3.3 4 6.3 7.6 6.3 11a6.3 6.3 0 0 1-12.6 0c0-3.4 3-7 6.3-11z" fill="currentColor" />,
  temp: <g fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M10 13.6V5a2 2 0 0 1 4 0v8.6a4 4 0 1 1-4 0z" /><path d="M12 9v6" /></g>,
  gauge: <g fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M4 17a8 8 0 1 1 16 0" /><path d="M12 17l4-5" /></g>,
  stress: <g fill="none" stroke="currentColor" strokeWidth="2.2"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="3" fill="currentColor" /></g>,
  pulse: <path d="M2.5 12h4l2.5-6 4 12 2.5-6h6" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />,
  moon: <path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6z" fill="currentColor" />,
  cycle: <circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" strokeWidth="2.4" strokeDasharray="3.4 2.6" />,
  tap: <g fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><circle cx="12" cy="12" r="3" /><path d="M12 3v3M12 18v3M3 12h3M18 12h3" /></g>,
  chev: <path d="M9 5.5l6.5 6.5L9 18.5" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" />,
  back: <path d="M15 4.5L7.5 12l7.5 7.5" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" />,
  check: <path d="M5.5 12.5l4.2 4.2L18.5 7.5" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" />,
  play: <path d="M8 5.5v13l10.5-6.5z" fill="currentColor" />,
  stop: <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" />,
  devices: <g fill="none" stroke="currentColor" strokeWidth="2" strokeLinejoin="round"><rect x="3" y="5" width="9" height="14" rx="3" /><circle cx="17.5" cy="12" r="3.5" /></g>,
  plus: <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" />,
  chart: <path d="M5 19v-7M12 19V5M19 19v-10" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" />,
  sync: <g fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3" /><path d="M18 3v4h-4M6 21v-4h4" /></g>,
  lock: <g fill="none" stroke="currentColor" strokeWidth="2.2"><rect x="5" y="10.5" width="14" height="10" rx="2.5" /><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" /></g>,
};
const Icon = ({ n, s = 18, c = 'currentColor', style }) => <svg width={s} height={s} viewBox="0 0 24 24" style={{ color: c, flex: 'none', ...style }}>{P[n]}</svg>;

/* ---------- Small atoms ---------- */
const Battery = ({ pct }) => pct == null
  ? <span style={{ color: C.sec, fontSize: 15 }}>Pin chưa đo</span>
  : <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 15, color: C.sec }}>
      <span style={{ width: 25, height: 12, borderRadius: 4, border: '1.5px solid #8E8E93', padding: 1.5, display: 'inline-block' }}>
        <span style={{ display: 'block', height: '100%', width: pct + '%', background: pct <= 20 ? '#FF9F0A' : C.green, borderRadius: 1.5 }} />
      </span>{pct} %</span>;
const Spinner = ({ s = 16, c = C.sec }) => <span className="spin" style={{ width: s, height: s, borderRadius: '50%', border: `2px solid ${c}`, borderTopColor: 'transparent', display: 'inline-block', flex: 'none' }} />;
const STATUS = {
  connected:    { t: 'Đã kết nối',     c: C.green },
  connecting:   { t: 'Đang kết nối…',  c: C.sec, spin: true },
  disconnected: { t: 'Đã ngắt',         c: C.sec },
  idle:         { t: 'Chưa kết nối',    c: C.sec },
};
const Status = ({ s }) => { const x = STATUS[s]; return <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, color: x.c, fontSize: 15, fontWeight: 500 }}>{x.spin ? <Spinner s={13} /> : <span style={{ width: 7, height: 7, borderRadius: 9, background: x.c }} />}{x.t}</span>; };
const Bars = ({ n }) => <span style={{ display: 'inline-flex', alignItems: 'flex-end', gap: 2, height: 14 }}>{[0,1,2,3].map(i => <span key={i} style={{ width: 3.5, height: 5 + i * 3, borderRadius: 2, background: n != null && i < n ? '#E5E5EA' : '#48484A' }} />)}</span>;
const Section = ({ children, right }) => <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', padding: '26px 4px 10px' }}><h3 style={{ fontSize: 20, fontWeight: 700, letterSpacing: '-0.01em' }} className="num">{children}</h3>{right}</div>;
const Card = ({ children, style, onClick }) => <div onClick={onClick} className={onClick ? 'press' : ''} style={{ background: C.card, borderRadius: 22, padding: 16, cursor: onClick ? 'pointer' : 'default', ...style }}>{children}</div>;
const LargeTitle = ({ title, sub }) => <div style={{ padding: '18px 20px 4px' }}><div style={{ color: C.sec, fontSize: 15, fontWeight: 500, marginBottom: 2 }}>{sub}</div><h1 className="num" style={{ fontSize: 34, fontWeight: 700, letterSpacing: '-0.025em' }}>{title}</h1></div>;
const Placeholder = ({ dev, s = 56 }) => (
  <div title={'Placeholder — chưa có ảnh chính thức ' + dev.short} style={{ width: s, height: s, borderRadius: s * 0.3, background: '#1C1C1E', display: 'grid', placeItems: 'center', flex: 'none', position: 'relative' }}>
    <div style={{ width: s * 0.56, height: s * 0.56, borderRadius: '50%', background: `radial-gradient(circle, #1C1C1E 52%, ${dev.tint} 54%, #6b5f4c 68%, #1C1C1E 71%)`, opacity: .9 }} />
  </div>);

/* ---------- Progress ring (one step per 0.5 s packet) ---------- */
function Ring({ size = 252, stroke = 15, color, progress, ticks, lit, glow, children }) {
  const c = size / 2, r = c - 26, L = 2 * Math.PI * r;
  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size} style={{ position: 'absolute', inset: 0, filter: glow ? `drop-shadow(0 0 14px ${color}55)` : 'none' }}>
        {ticks > 0 && Array.from({ length: ticks }).map((_, i) => {
          const a = (i / ticks) * 2 * Math.PI - Math.PI / 2, r1 = r + 15, r2 = r + 20;
          return <line key={i} x1={c + r1 * Math.cos(a)} y1={c + r1 * Math.sin(a)} x2={c + r2 * Math.cos(a)} y2={c + r2 * Math.sin(a)} stroke={i < lit ? color : 'rgba(255,255,255,0.13)'} strokeWidth="2" strokeLinecap="round" />;
        })}
        <circle cx={c} cy={c} r={r} fill="none" stroke={color} strokeOpacity=".16" strokeWidth={stroke} />
        <circle className="ring-arc" cx={c} cy={c} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={L} strokeDashoffset={L * (1 - Math.max(0.0001, progress))} transform={`rotate(-90 ${c} ${c})`} opacity={progress > 0 ? 1 : 0} />
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', textAlign: 'center' }}>{children}</div>
    </div>);
}
const MiniRing = ({ color, progress, s = 40 }) => { const r = s / 2 - 4, L = 2 * Math.PI * r; return (
  <svg width={s} height={s}><circle cx={s/2} cy={s/2} r={r} fill="none" stroke={color} strokeOpacity=".2" strokeWidth="5" />
  <circle className="ring-arc" cx={s/2} cy={s/2} r={r} fill="none" stroke={color} strokeWidth="5" strokeLinecap="round" strokeDasharray={L} strokeDashoffset={L * (1 - progress)} transform={`rotate(-90 ${s/2} ${s/2})`} /></svg>); };

/* what to show for a device+metric right now */
function readout(dev, metric, sess) {
  const s = sess[dev.id];
  if (s && s.metric === metric) {
    if (!s.done && s.vals.length && SCRIPT[dev.id][metric].kind === 'series') return { v: s.vals[s.vals.length - 1], live: true, s };
    if (!s.done) return { v: null, live: true, s };
    if (s.result === 'Chưa đeo') return { word: 'Chưa đeo', s };
    if (s.result) return { v: s.result, s };
  }
  const last = dev.last && dev.last[metric];
  if (last === 'Chưa đeo') return { word: 'Chưa đeo' };
  return last ? { v: last } : { none: true };
}

/* ---------- Glass tab bar (Liquid Glass belongs to the navigation layer only) ---------- */
function TabBar({ tab, go }) {
  const T = [['fleet', 'Thiết bị', 'devices'], ['scan', 'Thêm', 'plus'], ['feas', 'Khả thi', 'chart']];
  return (
    <div style={{ position: 'absolute', left: 0, right: 0, bottom: 10, display: 'flex', justifyContent: 'center', zIndex: 15, pointerEvents: 'none' }}>
      <div style={{ pointerEvents: 'auto', display: 'flex', gap: 4, padding: 5, borderRadius: 40, background: 'rgba(44,44,48,0.62)', backdropFilter: 'blur(26px) saturate(180%)', WebkitBackdropFilter: 'blur(26px) saturate(180%)', boxShadow: 'inset 0 0.5px 0 rgba(255,255,255,0.22), 0 10px 30px rgba(0,0,0,0.5)' }}>
        {T.map(([k, l, i]) => { const on = tab === k; return (
          <button key={k} onClick={() => go(k)} className="press" style={{ width: 92, height: 54, borderRadius: 30, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 3, background: on ? 'rgba(255,255,255,0.14)' : 'transparent', color: on ? '#fff' : '#AEAEB2' }}>
            <Icon n={i} s={21} /><span style={{ fontSize: 12, fontWeight: 600 }}>{l}</span></button>); })}
      </div>
    </div>);
}

/* ---------- A. Fleet (Health "Summary" cards per device) ---------- */
function Fleet({ app }) {
  const { conn, sim, openDetail, measureAll, stopAll, setConn } = app;
  const connected = QRING.filter(id => conn[id] === 'connected');
  const running = connected.some(id => sim.sess[id] && !sim.sess[id].done);
  const r = sim.sess.r09; const prog = running && r ? r.t / r.total : 0;
  return (

            return (
              <div key={id} onClick={() => openDetail(id)} style={{ padding: '12px 0', borderTop: idx ? `0.5px solid ${C.hair}` : 'none', cursor: 'pointer' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                  <span style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 17, fontWeight: 600 }}><span style={{ width: 8, height: 8, borderRadius: 4, background: d.tint }} />{d.short}</span>
                  <span style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
                    {ro.word ? <span style={{ fontSize: 15, fontWeight: 600, color: '#E5E5EA' }}>{ro.word}</span>
                      : ro.v != null ? <><span className="num" style={{ fontSize: 22, fontWeight: 600, color: m.color }}>{ro.v}</span><span style={{ fontSize: 15, color: C.sec }}>{m.unit}</span></>
                      : <span style={{ fontSize: 15, color: C.sec }}>{s && !s.done ? 'đang chờ gói…' : 'chưa đo'}</span>}
                  </span>
                </div>
                <div style={{ display: 'flex', alignItems: 'flex-end', gap: 2.4, height: 40, marginTop: 10 }}>
                  {Array.from({ length: tot }).map((_, i) => { const v = vals[i]; const h = typeof v === 'number' ? 14 + (v - 78) * 6.5 : (s && i < s.t ? 8 : 4);
                    return <span key={i} className="bar" style={{ flex: 1, height: Math.min(40, h), borderRadius: 2, background: typeof v === 'number' ? m.color : s && i < s.t ? '#8E8E93' : '#2C2C2E' }} />; })}
                </div>
                <div style={{ color: C.sec, fontSize: 13, marginTop: 7 }}>{s ? `${s.t} gói · mỗi 0,5 s` : 'Chưa chạy trong phiên này'}</div>
              </div>); })}
        </Card>

        <Section>Chỉ số kết nối</Section>
        <Card style={{ padding: '6px 16px' }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1.25fr 1fr 1fr', padding: '10px 0', fontSize: 13, fontWeight: 600, color: C.sec }}><span /><span>R09</span><span>HS500A</span></div>
          {rows.map(([k, f]) => (
            <div key={k} style={{ display: 'grid', gridTemplateColumns: '1.25fr 1fr 1fr', alignItems: 'center', padding: '11px 0', borderTop: `0.5px solid ${C.hair}` }}>
              <span style={{ fontSize: 15 }}>{k}</span>{f(DEV.r09)}{f(DEV.hs)}</div>))}
        </Card>
        <div style={{ color: C.sec, fontSize: 13, lineHeight: 1.45, padding: '10px 4px 0' }}>Đã quan sát: nhẫn gửi gói đo khoảng mỗi 0,5 s. Gói/giây, lỗi và độ trễ khi chạy nhiều thiết bị chưa đo; SDK sẽ ghi lại.</div>
        <div style={{ height: 110 }} />
      </div>
    </div>);
}

/* ---------- One independent app instance per phone ---------- */
function Phone({ cfg }) {
  const [tab, setTab] = useState(cfg.screen === 'detail' ? 'fleet' : cfg.screen);
  const [screen, setScreen] = useState(cfg.screen);
  const [detailId, setDetailId] = useState('r09');
  const [conn, setConn] = useState(cfg.conn);
  const [sel, setSel] = useState(cfg.sel || {});
  const [metricSel, setMetricSel] = useState({ r09: 'hr', hs: 'hr' });
  const [tech, setTech] = useState(false);
  const [sim, dispatch] = useReducer(simReducer, null, () => ({ sess: {}, logs: seedLogs() }));
  useEffect(() => { const t = setInterval(() => dispatch({ type: 'tick' }), 500); return () => clearInterval(t); }, []);
  useEffect(() => { if (cfg.auto) cfg.auto.forEach(([id, m]) => dispatch({ type: 'start', id, metric: m })); }, []);
  const go = k => { setTab(k); setScreen(k); };
  const app = {
    conn, setConn, sel, setSel, sim, dispatch, detailId, setDetailId, metricSel, setMetricSel, tech, setTech, go,
    openDetail: id => { setDetailId(id); setScreen('detail'); setTab('fleet'); },
    measureAll: () => QRING.forEach(id => { if (conn[id] === 'connected' && DEV[id].caps.includes('hr')) { setMetricSel(ms => ({ ...ms, [id]: 'hr' })); dispatch({ type: 'start', id, metric: 'hr' }); } }),
    stopAll: () => QRING.forEach(id => dispatch({ type: 'stop', id })),
    connect: ids => { // parallel: all start at once, finish independently
      setConn(c => { const n = { ...c }; ids.forEach(id => n[id] = 'connecting'); return n; });
      ids.forEach((id, i) => setTimeout(() => setConn(c => ({ ...c, [id]: 'connected' })), 1300 + i * 650));
      setSel({});
    },
  };
  const Screen = { fleet: Fleet, scan: Scan, detail: Detail, feas: Feas }[screen];
  return (
    <AndroidFrame width={393} height={851} darkMode time="14:32" battery={64}>
      <div style={{ position: 'absolute', inset: 0, background: C.bg }}>
        <div className="scroll" style={{ position: 'absolute', inset: 0, overflowY: 'auto' }}><Screen app={app} /></div>
        <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, height: 120, background: 'linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.88) 70%)', pointerEvents: 'none', zIndex: 12 }} />
        {screen === 'scan' && <ScanCTA app={app} />}
        <TabBar tab={tab} go={go} />
      </div>
    </AndroidFrame>);
}

const ALL = { r09: 'connected', hs: 'connected' };
const PHONES = [
  { k: 'A', label: 'Tổng quan', cfg: { screen: 'fleet', conn: ALL } },
  { k: 'B', label: 'Quét & thêm', cfg: { screen: 'scan', conn: { r09: 'idle', hs: 'idle' }, sel: { r09: true, hs: true } } },

  { k: 'D', label: 'Khả thi · song song', cfg: { screen: 'feas', conn: ALL, auto: [['r09', 'hr'], ['hs', 'hr']] } },
];
function Canvas() {
  return (
    <div style={{ width: 1760, height: 1000, padding: '22px 22px 0', display: 'flex', flexDirection: 'column' }}>
      <div style={{ display: 'flex', gap: 20 }}>

            <Phone cfg={p.cfg} />
          </div>))}

      </div>
    </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Canvas />);
</script>
