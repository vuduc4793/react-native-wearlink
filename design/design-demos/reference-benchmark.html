<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useReducer, useContext, createContext } = React;

/* ---------------- AndroidFrame (verbatim from huashu-design/assets/android_frame.jsx) ---------------- */
const androidFrameStyles = {
  wrapper: { display: 'inline-block', padding: 10, background: '#1a1a1a', borderRadius: 44, boxShadow: '0 0 0 2px #2a2a2a, 0 20px 60px rgba(0,0,0,0.3)', position: 'relative' },

/* ---------------- Tokens (WHOOP guideline -> SmartWear) ---------------- */
const C = {
  bg: '#000000', s1: '#0D0E0F', s2: '#15171A', s3: '#1E2124', line: '#25292D',
  text: '#FFFFFF', mut: '#B5B8BB', soft: '#8E9398',
  teal: '#00F19F', strain: '#0093E7', rblue: '#67AEE6', sleep: '#7BA1BB',
  green: '#16EC06', yellow: '#FFDE00', red: '#FF0026', redText: '#FF5A6E',
  track: '#25292D',
};
const F = {
  num: "'Barlow Semi Condensed', 'DIN Alternate', 'Be Vietnam Pro', sans-serif",
  mono: "'JetBrains Mono', ui-monospace, Menlo, monospace",
};
const H = { fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em' }; // WHOOP headline rule

/* ---------------- REAL content from spec ---------------- */
const DEVICES = {
  r09: { id: 'r09', name: 'Colmi R09', kind: 'Nhẫn', sdk: 'QRing', ble: 'R09_8404', mac: '30:32:43:31:84:04',
    hw: 'RT09_V3.1', fw: 'RT09_3.10.22_260420', color: C.rblue, ch: 'K1', img: 'ảnh R09',
    caps: ['hr', 'spo2', 'temp', 'stress', 'hrv', 'sleep', 'gesture'], battery: 19, batteryNote: '23 → 19 % · không sạc', rssi: '−70…−82', rssiRange: [-82, -70] },
  hs: { id: 'hs', name: 'HS500A', kind: 'Chưa rõ loại', sdk: 'QRing', ble: '(chưa ghi)', mac: '32:35:45:37:4E:00',
    hw: 'HS500A_V1.0', fw: 'HS500A_1.00.05_260725', color: '#F2B077', ch: 'K2', img: 'ảnh HS500A',
    caps: ['hr', 'spo2', 'bp', 'stress', 'hrv', 'cycle'], notes: 'Không màn hình · không nhiệt độ', battery: null, batteryNote: 'chưa đọc', rssi: null },
  coros: { id: 'coros', name: 'COROS PACE 3', kind: 'Đồng hồ', sdk: null, ble: 'COROS PACE 3 8E1086', mac: 'F7:AF:2F:22:09:90',
    reason: 'Quét thấy, phát dịch vụ FEE7 — chưa có SDK' },

  hr: { label: 'Nhịp tim', unit: 'bpm' }, spo2: { label: 'SpO2', unit: '%' }, temp: { label: 'Nhiệt độ', unit: '°C' },
  bp: { label: 'Huyết áp', unit: 'mmHg' }, stress: { label: 'Stress', unit: '' }, hrv: { label: 'HRV', unit: 'ms' },
  sleep: { label: 'Giấc ngủ', sync: true, cap: 'giao thức mới · đồng bộ sắp có' },
  cycle: { label: 'Chu kỳ KN', sync: true, cap: 'đồng bộ sắp có' },
  gesture: { label: 'Cử chỉ chạm', event: true, cap: 'sự kiện từ nhẫn' },
};
// Only what was measured for real; anything else stays "chưa đo".
const SIM = {
  r09: {
    hr: { total: 50, dur: '~25 s', seq: [79, 80, 80, 81, 82, 82, 81, 80, 79, 79] },
    spo2: { total: 52, dur: '~26 s', seq: [97, 98, 98, 99, 99, 98, 97, 98] },
    temp: { total: 52, dur: '~26 s', final: 36.6 },
  },
  hs: { hr: { total: 6, dur: '—', notWorn: true } },
};
const STATUS = {
  connected: { label: 'Đã kết nối', color: C.green }, connecting: { label: 'Đang kết nối', color: C.yellow },
  lost: { label: 'Mất kết nối', color: C.red }, idle: { label: 'Đã ngắt', color: C.soft },
  scanning: { label: 'Đang quét', color: C.yellow }, error: { label: 'Lỗi', color: C.red },
};

/* ---------------- helpers ---------------- */
const hx = (v) => v.toString(16).toUpperCase().padStart(2, '0');
function hrHex(v) { // real HR packet layout; checksum = sum of bytes mod 256 (verified on the real sample: ... B5)
  const b = [0x69, 0x01, 0x00, v, 0x00, 0x00, 0xFA, 0x02, 0, 0, 0, 0, 0, 0, 0];
  b.push(b.reduce((a, x) => a + x, 0) & 0xFF);

}
const vn = (v) => (typeof v === 'number' ? String(v).replace('.', ',') : v);
function rangeStr(vals) {
  if (!vals.length) return '—';
  const mn = Math.min(...vals), mx = Math.max(...vals);
  return mn === mx ? vn(mn) : `${vn(mn)}–${vn(mx)}`;
}
const secs = (n) => vn(Math.round(n * 5) / 10);

/* ---------------- shared world (all four phones see the same devices) ---------------- */
const initial = {
  status: { r09: 'connected', hs: 'lost' },
  runs: {},
  last: { r09: { hr: '79–82', spo2: '97–99', temp: '36,6' }, hs: { hr: 'Chưa đeo' } },
  logs: {
    r09: [
      { t: 'trước', dir: '←', hex: '73 0C 13', hi: [2], note: 'notify pin · 0x13 = 19 %' },
      { t: 'trước', dir: '←', hex: '6A 0B A6 …', note: 'stop nhiệt độ · 36,6 °C' },
      { t: 'trước', dir: '←', hex: '69 01 00 4F 00 00 FA 02 00 00 00 00 00 00 00 B5', hi: [3], note: 'HR · 0x4F = 79 bpm · gói thật' },
    ],
    hs: [{ t: 'trước', dir: '←', hex: null, note: 'đo nhịp tim → thiết bị báo "Chưa đeo"' }],
  },
  lanes: { r09: Array(24).fill(0), hs: Array(24).fill(0) },
  pkts: { r09: 0, hs: 0 },
  batchNote: null,
};
function canSim(s, id, m) { return s.status[id] === 'connected' && SIM[id] && SIM[id][m]; }
function startRun(s, id, m) {
  return {
    ...s,
    runs: { ...s.runs, [id]: { metric: m, n: 0, total: SIM[id][m].total, vals: [], v: null, done: false } },
    logs: { ...s.logs, [id]: [{ t: '+0 s', dir: '→', hex: null, note: `lệnh bắt đầu đo ${CAPS[m].label}` }, ...s.logs[id]].slice(0, 60) },
  };
}

  const r = s.runs[id];

    logs: { ...s.logs, [id]: [{ t: `+${secs(r.n * 0.5)} s`, dir: '→', hex: null, note: why || 'lệnh dừng đo' }, ...s.logs[id]] } };
}
function reducer(s, a) {

      let n = { ...s, status: { ...s.status, [a.id]: a.v } };
      if (a.v !== 'connected') n = stopRun(n, a.id, 'mất liên kết — dừng đo');
      return n;
    }
    case 'BATCH': {

        if (s.status[id] !== 'connected') return skip.push(`${d.name}: chưa kết nối`);
        if (!SIM[id][a.m]) return skip.push(`${d.name}: chưa đo thật`);
        n = startRun(n, id, a.m); ok.push(d.name);
      });
      return { ...n, batchNote: `${CAPS[a.m].label}: gửi lệnh tới ${ok.length} thiết bị${ok.length ? ' (' + ok.join(', ') + ')' : ''}${skip.length ? ' · bỏ qua ' + skip.join('; ') : ''}` };
    }
    case 'TICK': {
      const runs = { ...s.runs }, logs = { ...s.logs }, last = { ...s.last }, lanes = { ...s.lanes }, pkts = { ...s.pkts };
      SAVED.forEach((id) => {
        const r = runs[id]; let hit = 0;
        if (r && !r.done) {
          const n = r.n + 1, sim = SIM[id][r.metric], t = `+${secs(n * 0.5)} s`;
          let v = null, e;
          if (sim.seq) v = sim.seq[(n - 1) % sim.seq.length];
          if (r.metric === 'hr' && v != null) e = { t, dir: '←', hex: hrHex(v), hi: [3], note: `HR · 0x${hx(v)} = ${v} bpm${v === 79 ? ' · trùng gói thật' : ' · dựng theo gói thật'}` };
          else if (r.metric === 'spo2') e = { t, dir: '←', hex: null, note: `SpO2 ${v} % · hex SpO2 chưa ghi mẫu` };
          else if (r.metric === 'temp') {
            if (n === sim.total) { v = sim.final; e = { t, dir: '←', hex: '6A 0B A6 …', note: 'stop nhiệt độ · 36,6 °C' }; }
            else e = { t, dir: '←', hex: null, note: 'đang đo nhiệt độ · giá trị gửi khi dừng' };
          } else if (sim.notWorn) e = { t, dir: '←', hex: null, note: n === sim.total ? 'kết quả: "Chưa đeo"' : 'chờ cảm biến…' };
          const vals = v != null ? [...r.vals, v] : r.vals;
          const done = n >= sim.total;
          let result;
          if (done) { result = sim.notWorn ? 'Chưa đeo' : rangeStr(vals); last[id] = { ...last[id], [r.metric]: result }; }
          runs[id] = { ...r, n, v: v != null ? v : r.v, vals, done, result, err: sim.notWorn && done };
          logs[id] = [e, ...logs[id]].slice(0, 60);
          hit = 1; pkts[id] += 1;
        }
        lanes[id] = [...lanes[id].slice(-23), hit];

      return { ...s, runs, logs, last, lanes, pkts };
    }

  }
}
const World = createContext(null);
function useWorld() { return useContext(World); }
function connectMany(dispatch, ids) {
  ids.forEach((id, i) => {
    dispatch({ type: 'STATUS', id, v: 'connecting' });
    setTimeout(() => dispatch({ type: 'STATUS', id, v: 'connected' }), 1100 + i * 700);
  });
}

/* ---------------- primitives ---------------- */
function Icon({ name, size = 22, color = 'currentColor', sw = 1.8 }) {
  const p = { fill: 'none', stroke: color, strokeWidth: sw, strokeLinecap: 'round', strokeLinejoin: 'round' };
  const g = {
    fleet: <><rect x="3" y="3" width="7.5" height="7.5" rx="1.5" {...p} /><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5" {...p} /><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5" {...p} /><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5" {...p} /></>,
    scan: <><circle cx="12" cy="12" r="2" {...p} /><path d="M7.5 7.5a6.4 6.4 0 000 9M16.5 7.5a6.4 6.4 0 010 9M4.4 4.4a10.7 10.7 0 000 15.2M19.6 4.4a10.7 10.7 0 010 15.2" {...p} /></>,
    device: <><circle cx="12" cy="12" r="7.5" {...p} /><circle cx="12" cy="12" r="3.5" {...p} /></>,
    mon: <path d="M3 12h3.5l2.5-6 4 12 2.5-6H21" {...p} />,
    check: <path d="M5 12.5l4.5 4.5L19 7.5" {...p} />,
    lock: <><rect x="5" y="10.5" width="14" height="10" rx="2" {...p} /><path d="M8 10.5V7.5a4 4 0 018 0v3" {...p} /></>,
    chev: <path d="M9 5l7 7-7 7" {...p} />,
    back: <path d="M15 5l-7 7 7 7" {...p} />,
    play: <path d="M8 5.5v13l11-6.5z" fill={color} stroke="none" />,
    stop: <rect x="7" y="7" width="10" height="10" rx="1.5" fill={color} stroke="none" />,
    sync: <path d="M20 11a8 8 0 00-14.3-4.3L4 9M4 13a8 8 0 0014.3 4.3L20 15M4 4v5h5M20 20v-5h-5" {...p} />,
  };
  return <svg width={size} height={size} viewBox="0 0 24 24" style={{ flex: 'none', display: 'block' }}>{g[name]}</svg>;
}
function Label({ children, color = C.soft, style }) {
  return <div style={{ fontSize: 12, ...H, color, ...style }}>{children}</div>;
}
function StatusPill({ st }) {
  const s = STATUS[st] || STATUS.idle;

    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 12, fontWeight: 600, color: C.mut, whiteSpace: 'nowrap' }}>
      <span style={{ width: 8, height: 8, borderRadius: 9, background: s.color, animation: st === 'connecting' || st === 'scanning' ? 'blink 1s infinite' : 'none' }} />

    <div style={{ width: size, height: size, flex: 'none', borderRadius: 8, background: '#2B2F33', display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center', fontSize: 12, lineHeight: 1.15, color: '#C9CDD1', padding: 3 }}>{text}</div>
  );
}

  const base = { height: 48, borderRadius: 8, fontSize: 14, ...H, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, width: '100%' };
  const k = kind === 'cta'
    ? { background: disabled ? C.s3 : C.teal, color: disabled ? C.soft : '#000', border: 'none' }
    : { background: 'transparent', color: disabled ? C.soft : C.text, border: `1.5px solid ${disabled ? C.line : '#5A6066'}` };

function polar(cx, cy, r, deg) { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }

// WHOOP score dial -> fleet dial
function Dial({ frac, color, value, label, sub, size = 100 }) {

    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, width: size }}>
      <div style={{ position: 'relative', width: size, height: size }}>
        <svg width={size} height={size}>
          <circle cx={c} cy={c} r={r} fill="none" stroke={C.track} strokeWidth="6" />

}
// Signature: one tick = one 0.5 s packet

  const c = size / 2;

    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size}>
        {Array.from({ length: total }).map((_, i) => {

function HexLine({ e, color }) {

        <div style={{ fontFamily: F.mono, fontSize: 13, marginTop: 3, letterSpacing: '0.02em', lineHeight: 1.5, wordBreak: 'break-word' }}>
          {bytes.map((b, i) => (
            <span key={i} style={{ color: (e.hi || []).includes(i) ? color : (bytes.length === 16 && i === 15) ? C.soft : '#E3E6E8', fontWeight: (e.hi || []).includes(i) ? 600 : 400 }}>{b}{i < bytes.length - 1 ? ' ' : ''}</span>
          ))}
        </div>
      )}
    </div>
  );
}

function liveVal(r) { return r && r.v != null ? vn(r.v) : null; }

function DetailScreen({ devId, setDev }) {
  const { s, dispatch } = useWorld();
  const d = DEVICES[devId], st = s.status[devId], r = s.runs[devId];
  const measurable = d.caps.filter((k) => !CAPS[k].sync && !CAPS[k].event);
  const [m, setM] = useState(r ? r.metric : measurable[0]);
  useEffect(() => { if (r && !r.done) setM(r.metric); }, [r && r.metric, r && r.done]);
  const sim = SIM[devId] && SIM[devId][m];
  const cur = r && r.metric === m ? r : null;
  const live = cur && !cur.done;
  const last = (s.last[devId] || {})[m];
  const others = ['hr', 'spo2', 'temp', 'bp', 'cycle'].filter((k) => !d.caps.includes(k)).map((k) => CAPS[k].label);
  let big = '—', cap = 'chưa đo', err = false;
  if (cur) {
    if (cur.err) { big = 'Chưa đeo'; cap = 'thiết bị báo — đeo lại rồi đo'; err = true; }
    else if (live) { big = liveVal(cur) || '…'; cap = `${CAPS[m].label} · gói ${cur.n}/${cur.total}`; }
    else { big = cur.result; cap = `kết quả · ${cur.n} gói`; }
  } else if (last) { big = last; err = last === 'Chưa đeo'; cap = err ? 'lần đo trước' : `lần đo trước · ${sim ? sim.dur : ''}`; }
  return (
    <div>
      {/* device switcher: every saved device stays visible */}
      <div style={{ display: 'flex', gap: 8, padding: '12px 16px 4px' }}>
        {SAVED.map((id) => {
          const x = DEVICES[id], rr = s.runs[id], on = id === devId, lv = rr && !rr.done;
          return (
            <button key={id} onClick={() => setDev(id)} style={{ flex: 1, textAlign: 'left', background: on ? C.s2 : 'transparent', border: `1px solid ${on ? x.color : C.line}`, borderRadius: 10, padding: '8px 10px', color: C.text }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}><ChDot d={x} size={9} /><span style={{ fontSize: 14, fontWeight: 700 }}>{x.name}</span></div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 4 }}>
                <StatusPill st={s.status[id]} />
                {lv && <span style={{ fontFamily: F.num, fontSize: 16, fontWeight: 700, color: x.color }}>{liveVal(rr) || '…'}</span>}
              </div>
            </button>
          );
        })}
      </div>
      <div style={{ display: 'flex', gap: 12, padding: '12px 18px 4px', alignItems: 'center' }}>
        <Placeholder text={d.img} size={56} />
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 20, ...H, letterSpacing: '0.06em' }}>{d.name}</div>
          <div style={{ fontSize: 13, color: C.mut, marginTop: 2 }}>{d.kind} · {d.sdk} SDK · <span style={{ fontFamily: F.mono, fontSize: 12 }}>{d.ble}</span></div>
        </div>
        <div style={{ textAlign: 'right' }}>
          <div style={{ fontFamily: F.num, fontSize: 24, fontWeight: 700, lineHeight: 1 }}>{d.battery != null ? `${d.battery}%` : '—'}</div>
          <div style={{ fontSize: 12, color: C.soft, marginTop: 3 }}>pin {d.battery != null ? '' : 'chưa đọc'}</div>
        </div>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '6px 12px', padding: '8px 18px 4px', fontSize: 12 }}>
        {[['MAC', d.mac], ['RSSI', d.rssi ? `${d.rssi} dBm` : '—'], ['HW', d.hw], ['FW', d.fw]].map(([k, v]) => (
          <div key={k} style={{ display: 'flex', gap: 6, minWidth: 0 }}><span style={{ color: C.soft, fontWeight: 600, width: 34, flex: 'none' }}>{k}</span><span style={{ fontFamily: F.mono, color: C.mut, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{v}</span></div>
        ))}
      </div>

      {/* live hero — WHOOP score ring, re-cut: one tick per 0.5 s packet */}
      <div style={{ margin: '12px 16px 0', borderRadius: 14, padding: '14px 14px 16px', background: 'linear-gradient(180deg, #283339 0%, #101518 100%)', border: `1px solid #2E3A40` }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <Label color="#D5DEE3">Đo trực tiếp</Label>
          <span style={{ fontSize: 12, color: '#C3CED4' }}>{live ? '● đang nhận · 0,5 s/gói' : sim ? `${sim.total} gói · ${sim.dur}` : 'chưa có lần đo thật'}</span>
        </div>
        <div style={{ display: 'flex', gap: 6, margin: '10px 0 4px', flexWrap: 'wrap' }}>

          ))}
        </div>
        <div style={{ display: 'flex', justifyContent: 'center', margin: '6px 0 8px' }}>
          <TickRing total={sim ? sim.total : 50} n={cur ? cur.n : 0} color={d.color} err={err && !!cur}>

            {!err && big !== '—' && <div style={{ fontSize: 14, color: '#C3CED4', marginTop: 2, fontWeight: 600 }}>{CAPS[m].unit}</div>}
            <div style={{ fontSize: 12, color: '#C3CED4', marginTop: 6, maxWidth: 140, textAlign: 'center', lineHeight: 1.35 }}>{cap}</div>

              {st !== 'connected' ? 'Kết nối trước khi đo' : sim ? <><Icon name="play" size={15} color="#000" />Bắt đầu đo {CAPS[m].label}</> : `${CAPS[m].label}: chưa đo thật`}

      </div>

      <div style={{ display: 'flex', justifyContent: 'space-between', padding: '18px 18px 8px' }}>
        <Label>Khả năng · {d.caps.length} mục</Label><span style={{ fontSize: 12, color: C.soft }}>sinh từ bảng capability</span>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8, padding: '0 16px' }}>
        {d.caps.map((k) => {
          const c = CAPS[k], v = (s.last[devId] || {})[k], sel = k === m;
          const pick = !c.sync && !c.event;
          return (
            <div key={k} className={pick ? 'tap' : ''} onClick={() => pick && setM(k)} style={{ background: C.s1, border: `1px solid ${sel ? d.color : C.line}`, borderRadius: 10, padding: '9px 10px', cursor: pick ? 'pointer' : 'default', minHeight: 70 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: C.mut }}>{c.label}</div>

      <div style={{ fontSize: 12, color: C.soft, padding: '8px 18px 0' }}>Không khai báo: {others.join(' · ')}{d.notes ? ` — ${d.notes}` : ''}</div>

      </div>
      <div style={{ padding: 16 }}>
        <Btn kind="ghost" disabled><Icon name="sync" size={16} color={C.soft} />Đồng bộ lịch sử · sắp có</Btn>
      </div>
    </div>
  );
}

        </div>
        <div style={{ fontSize: 14, color: C.mut, lineHeight: 1.5 }}>
          Android thường giới hạn <b style={{ color: C.text }}>~7 kết nối GATT</b> đồng thời. Mỗi khe tô màu kênh của thiết bị đang chiếm.
          <div style={{ fontSize: 12, color: C.soft, marginTop: 6 }}>Ngưỡng thực trên Redmi Note 7 Pro: chưa đo</div>
        </div>
      </div>

      <div style={{ margin: '0 16px', background: C.s1, border: `1px solid ${C.line}`, borderRadius: 12, overflow: 'hidden' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1.35fr 1fr .8fr .7fr .8fr', padding: '10px 12px', fontSize: 12, fontWeight: 700, color: C.soft, textTransform: 'uppercase', letterSpacing: '0.06em' }}>
          <span>Thiết bị</span><span>RSSI</span><span>Gói/s</span><span>Lỗi</span><span>Trễ</span>
        </div>
        {rows.map((id) => {
          const d = DEVICES[id], ok = !!d.sdk, st = s.status[id], r = s.runs[id], live = r && !r.done;
          const cell = { fontFamily: F.num, fontSize: 16, fontWeight: 600 };
          const na = <span style={{ color: C.soft }}>—</span>;
          return (
            <div key={id} className={ok ? 'tap' : ''} onClick={() => ok && go('detail', id)} style={{ display: 'grid', gridTemplateColumns: '1.35fr 1fr .8fr .7fr .8fr', alignItems: 'center', padding: '10px 12px', borderTop: `1px solid ${C.line}`, cursor: ok ? 'pointer' : 'default' }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>{ok ? <ChDot d={d} size={9} /> : <Icon name="lock" size={13} color={C.soft} />}<span style={{ fontSize: 14, fontWeight: 700, color: ok ? C.text : C.mut, whiteSpace: 'nowrap' }}>{ok ? d.name : 'COROS'}</span></div>
                <div style={{ marginTop: 3 }}>{ok ? <StatusPill st={st} /> : <span style={{ fontSize: 12, color: C.soft }}>chưa có SDK</span>}</div>
              </div>
              <span style={{ ...cell, color: d.rssi ? C.text : C.soft }}>{d.rssi || '—'}</span>
              <span style={cell}>{live ? <span>2<span style={{ color: C.yellow }}>*</span></span> : ok ? na : '—'}</span>
              <span style={{ ...cell, color: C.soft }}>{ok ? na : '—'}</span>
              <span style={{ ...cell, color: C.soft }}>{ok ? na : '—'}</span>
            </div>
          );
        })}
      </div>
      <div style={{ fontSize: 12, color: C.soft, padding: '8px 18px 0', lineHeight: 1.5 }}><b style={{ color: C.mut }}>—</b> = chưa đo. Gói/s, lỗi, độ trễ khi nhiều thiết bị cùng chạy chưa có số thật. <span style={{ color: C.yellow }}>*</span> số mô phỏng trong prototype (nhẫn gửi ~0,5 s/gói).</div>

      <Label style={{ padding: '18px 18px 8px' }}>Dải gói · mỗi vạch 0,5 s</Label>
      <div style={{ margin: '0 16px', background: C.s1, border: `1px solid ${C.line}`, borderRadius: 12, padding: '4px 14px' }}>
        {SAVED.map((id) => {
          const d = DEVICES[id], r = s.runs[id], live = r && !r.done;
          return (
            <div key={id} style={{ padding: '10px 0', borderTop: id === SAVED[0] ? 'none' : `1px solid ${C.line}` }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, marginBottom: 6 }}>
                <span style={{ display: 'flex', alignItems: 'center', gap: 6, fontWeight: 700 }}><span style={{ color: d.color, fontFamily: F.mono, fontSize: 12 }}>{d.ch}</span>{d.name}</span>
                <span style={{ color: C.mut, fontFamily: F.num, fontSize: 15 }}>{live ? `${CAPS[r.metric].label} ${liveVal(r) || '…'}` : r && r.err ? 'Chưa đeo' : 'im lặng'} · {s.pkts[id]} gói</span>
              </div>
              <Lane bits={s.lanes[id]} color={d.color} />
            </div>
          );
        })}
      </div>

      <Label style={{ padding: '18px 18px 8px' }}>RSSI đã ghi (dBm)</Label>
      <div style={{ margin: '0 16px 12px', background: C.s1, border: `1px solid ${C.line}`, borderRadius: 12, padding: '12px 14px' }}>
        {SAVED.map((id) => {
          const d = DEVICES[id], x = (v) => ((v + 100) / 60) * 100;
          return (
            <div key={id} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
              <span style={{ width: 70, fontSize: 13, fontWeight: 600 }}>{d.name}</span>
              <div style={{ flex: 1, height: 12, background: C.s3, borderRadius: 6, position: 'relative' }}>
                {d.rssiRange && <div style={{ position: 'absolute', left: `${x(d.rssiRange[0])}%`, width: `${x(d.rssiRange[1]) - x(d.rssiRange[0])}%`, top: 0, bottom: 0, background: d.color, borderRadius: 6 }} />}
              </div>
              <span style={{ width: 62, textAlign: 'right', fontFamily: F.num, fontSize: 14, color: d.rssi ? C.text : C.soft }}>{d.rssi || 'chưa đo'}</span>
            </div>
          );
        })}
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: C.soft, marginLeft: 80, marginRight: 72, fontFamily: F.num }}><span>−100</span><span>−70</span><span>−40</span></div>
      </div>
      <div style={{ padding: '4px 16px 16px' }}>
        <Btn onClick={() => dispatch({ type: 'BATCH', m: 'hr' })} disabled={!conn.length}><Icon name="play" size={15} color={conn.length ? '#000' : C.soft} />Đo đồng loạt · Nhịp tim</Btn>
        {s.batchNote && <div style={{ fontSize: 12, color: C.mut, marginTop: 8, lineHeight: 1.45 }}>{s.batchNote}</div>}
      </div>
    </div>
  );
}

/* ---------------- Phone shell: each phone is its own nav state machine ---------------- */
const TABS = [['fleet', 'Tổng quan', 'fleet'], ['scan', 'Quét', 'scan'], ['detail', 'Thiết bị', 'device'], ['mon', 'Giám sát', 'mon']];
function AppPhone({ initial }) {
  const [tab, setTab] = useState(initial);
  const [dev, setDev] = useState('r09');
  const { s } = useWorld();
  const go = (t, id) => { if (id) setDev(id); setTab(t); };
  const running = SAVED.filter((id) => s.runs[id] && !s.runs[id].done).length;
  return (
    <AndroidFrame width={393} height={851} darkMode time="9:41" battery={64}>
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: C.bg, color: C.text, fontFamily: "'Be Vietnam Pro', sans-serif" }}>
        <div className="scroll" style={{ flex: 1, overflow: 'auto' }} key={tab}>
          {tab === 'fleet' && <FleetScreen go={go} />}
          {tab === 'scan' && <ScanScreen go={go} />}
          {tab === 'detail' && <DetailScreen devId={dev} setDev={setDev} />}
          {tab === 'mon' && <MonitorScreen go={go} />}
        </div>
        <div style={{ display: 'flex', borderTop: `1px solid ${C.line}`, background: '#050606', height: 62, flex: 'none' }}>
          {TABS.map(([id, label, ic]) => (
            <button key={id} onClick={() => setTab(id)} style={{ flex: 1, background: 'none', border: 'none', color: tab === id ? C.text : C.soft, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 4, position: 'relative' }}>
              {tab === id && <span style={{ position: 'absolute', top: 0, width: 28, height: 3, borderRadius: 2, background: C.teal }} />}
              <Icon name={ic} size={21} />
              <span style={{ fontSize: 12, fontWeight: tab === id ? 700 : 500 }}>{label}</span>
              {id === 'mon' && running > 0 && <span style={{ position: 'absolute', top: 9, right: 'calc(50% - 18px)', width: 8, height: 8, borderRadius: 8, background: C.teal }} />}
            </button>
          ))}
        </div>
      </div>
    </AndroidFrame>
  );
}

const SCREENS = [['fleet', 'A · Tổng quan / Fleet'], ['scan', 'B · Quét & thêm'], ['detail', 'C · Chi tiết thiết bị'], ['mon', 'D · Giám sát song song']];
function App() {
  const [s, dispatch] = useReducer(reducer, initial);
  useEffect(() => {
    const t = setInterval(() => dispatch({ type: 'TICK' }), 500);
    const k = setTimeout(() => dispatch({ type: 'START', id: 'r09', m: 'hr' }), 300); // demo: R09 đang đo khi mở
    return () => { clearInterval(t); clearTimeout(k); };
  }, []);
  return (
    <World.Provider value={{ s, dispatch }}>
      <div style={{ width: 1760, margin: '0 auto', padding: '14px 24px 0' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 12 }}>
          <div style={{ fontSize: 14, ...H, color: C.text }}>SmartWear Lab <span style={{ color: C.soft, fontWeight: 500, letterSpacing: '0.04em' }}>— prototype dark · 393×851 dp</span></div>
          <div style={{ fontSize: 12, color: C.soft }}>Benchmark: ngôn ngữ thị giác app WHOOP (theo Brand & Design Guidelines công khai) · không dùng logo/nhãn hiệu · số liệu chỉ từ spec, còn lại ghi "chưa đo"</div>
        </div>
        <div style={{ display: 'flex', gap: 20 }}>
          {SCREENS.map(([id, label]) => (
            <div key={id}>
              <div style={{ fontSize: 13, color: C.mut, marginBottom: 8, fontWeight: 600 }}>{label}</div>
              <AppPhone initial={id} />
            </div>
          ))}
        </div>
      </div>
    </World.Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
